<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Rolling Ball Reaction Test</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

canvas {
    width: 1200px;
    height: 700px;
    background: #061a36;
    display: block;
}
</style>
</head>

<body>

<canvas id="game" width="1200" height="700"></canvas>

<script>

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var W = 1200;
var H = 700;

var totalTrials = 20;
var trial = 0;
var correct = 0;

var speed = 3;
var minSpeed = 2;
var maxSpeed = 8;

var state = "ready";

var x = 0;
var y = 0;
var dx = 0;
var dy = 0;

var number = 1;
var radius = 75;

var rotation = 0;
var startTime = 0;

var reactionTimes = [];

var countdown = 3;
var countdownTimer = null;

var numbers = [];


function createBalancedNumbers() {

    var arr = [];

    // 1-8 each appears twice
    for (var i = 1; i <= 8; i++) {
        arr.push(i);
        arr.push(i);
    }

    // Randomly choose 4 different numbers to appear one extra time
    var extraNumbers = [];

    while (extraNumbers.length < 4) {

        var n = Math.floor(Math.random() * 8) + 1;

        if (extraNumbers.indexOf(n) === -1) {
            extraNumbers.push(n);
        }
    }

    for (var j = 0; j < extraNumbers.length; j++) {
        arr.push(extraNumbers[j]);
    }

    // Fisher-Yates shuffle
    for (var k = arr.length - 1; k > 0; k--) {

        var randomIndex =
            Math.floor(Math.random() * (k + 1));

        var temp = arr[k];
        arr[k] = arr[randomIndex];
        arr[randomIndex] = temp;
    }

    return arr;
}


function startGame() {

    trial = 0;
    correct = 0;
    speed = 3;
    reactionTimes = [];

    numbers = createBalancedNumbers();

    startCountdown();
}


function startCountdown() {

    state = "countdown";
    countdown = 3;

    if (countdownTimer !== null) {
        clearInterval(countdownTimer);
    }

    countdownTimer = setInterval(function () {

        countdown--;

        if (countdown <= 0) {

            clearInterval(countdownTimer);
            countdownTimer = null;

            trial = 0;

            newTrial();
        }

    }, 1000);
}


function newTrial() {

    if (trial >= totalTrials) {

        state = "result";
        return;
    }

    state = "playing";

    number = numbers[trial];

    var side = Math.floor(Math.random() * 4);

    rotation = 0;

    if (side === 0) {

        x = -radius;
        y = radius + Math.random() * (H - radius * 2);

        dx = speed;
        dy = 0;

    } else if (side === 1) {

        x = W + radius;
        y = radius + Math.random() * (H - radius * 2);

        dx = -speed;
        dy = 0;

    } else if (side === 2) {

        x = radius + Math.random() * (W - radius * 2);
        y = -radius;

        dx = 0;
        dy = speed;

    } else {

        x = radius + Math.random() * (W - radius * 2);
        y = H + radius;

        dx = 0;
        dy = -speed;
    }

    startTime = performance.now();
}


function changeSpeed(isCorrect) {

    if (isCorrect) {

        speed++;

        if (speed > maxSpeed) {
            speed = maxSpeed;
        }

    } else {

        speed--;

        if (speed < minSpeed) {
            speed = minSpeed;
        }
    }
}


function answer(value) {

    if (state !== "playing") {
        return;
    }

    var reaction = performance.now() - startTime;

    if (value === number) {

        correct++;

        reactionTimes.push(reaction);

        changeSpeed(true);

    } else {

        changeSpeed(false);
    }

    trial++;

    newTrial();
}


function outside() {

    return (
        x < -radius * 1.5 ||
        x > W + radius * 1.5 ||
        y < -radius * 1.5 ||
        y > H + radius * 1.5
    );
}


function drawBall() {

    ctx.save();

    ctx.translate(x, y);

    if (dx !== 0) {
        rotation += dx / radius;
    } else {
        rotation += dy / radius;
    }

    var front = Math.cos(rotation);

    var gradient = ctx.createRadialGradient(
        -radius * 0.35,
        -radius * 0.4,
        radius * 0.1,
        0,
        0,
        radius
    );

    gradient.addColorStop(0, "#fff9a0");
    gradient.addColorStop(0.25, "#fff43b");
    gradient.addColorStop(0.65, "#ffd400");
    gradient.addColorStop(1, "#d49b00");

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = gradient;

    ctx.shadowColor = "rgba(0,0,0,0.45)";
    ctx.shadowBlur = 18;
    ctx.shadowOffsetX = 8;
    ctx.shadowOffsetY = 10;

    ctx.fill();

    ctx.shadowColor = "transparent";

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );

    ctx.clip();

    var numberScale =
        0.25 + Math.abs(front) * 0.75;

    if (front < 0) {
        ctx.scale(-numberScale, 1);
    } else {
        ctx.scale(numberScale, 1);
    }

    ctx.fillStyle = "#111111";

    ctx.font = "bold 72px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        number,
        0,
        0
    );

    ctx.restore();

    ctx.restore();
}


function drawBackground() {

    ctx.fillStyle = "#061a36";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    if (state === "playing") {

        ctx.fillStyle = "#ffffff";

        ctx.font = "22px Arial";

        ctx.textAlign = "left";

        ctx.fillText(
            "Trial: " + (trial + 1) + " / " + totalTrials,
            25,
            35
        );

        ctx.fillText(
            "Speed: " + speed,
            25,
            65
        );

        ctx.fillText(
            "Correct: " + correct,
            25,
            95
        );
    }


    if (state === "ready") {

        ctx.fillStyle = "#ffffff";

        ctx.textAlign = "center";

        ctx.font = "bold 38px Arial";

        ctx.fillText(
            "Rolling Ball Reaction Test",
            W / 2,
            H / 2 - 45
        );

        ctx.font = "24px Arial";

        ctx.fillText(
            "Press SPACE to start",
            W / 2,
            H / 2 + 10
        );

        ctx.font = "18px Arial";

        ctx.fillText(
            "Use number keys 1 - 8",
            W / 2,
            H / 2 + 50
        );
    }


    if (state === "countdown") {

        ctx.fillStyle = "#ffffff";

        ctx.textAlign = "center";

        ctx.font = "bold 100px Arial";

        ctx.fillText(
            countdown,
            W / 2,
            H / 2
        );
    }


    if (state === "result") {

        var accuracy =
            (correct / totalTrials) * 100;

        var average = 0;

        if (reactionTimes.length > 0) {

            var sum = 0;

            for (var i = 0; i < reactionTimes.length; i++) {
                sum += reactionTimes[i];
            }

            average =
                sum / reactionTimes.length;
        }

        ctx.fillStyle = "#ffffff";

        ctx.textAlign = "center";

        ctx.font = "bold 42px Arial";

        ctx.fillText(
            "Test Complete",
            W / 2,
            180
        );

        ctx.font = "28px Arial";

        ctx.fillText(
            "Correct: " + correct + " / " + totalTrials,
            W / 2,
            250
        );

        ctx.fillText(
            "Accuracy: " + accuracy.toFixed(1) + "%",
            W / 2,
            300
        );

        ctx.fillText(
            "Average Reaction Time: " +
            average.toFixed(0) +
            " ms",
            W / 2,
            350
        );

        ctx.fillText(
            "Final Speed: " + speed,
            W / 2,
            400
        );

        ctx.font = "20px Arial";

        ctx.fillText(
            "Press SPACE to restart",
            W / 2,
            470
        );
    }
}


function draw() {

    drawBackground();

    if (state === "playing") {
        drawBall();
    }
}


function update() {

    if (state !== "playing") {
        return;
    }

    x += dx;
    y += dy;

    if (outside()) {

        changeSpeed(false);

        trial++;

        newTrial();
    }
}


function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);
}


document.addEventListener(
    "keydown",
    function(event) {

        if (event.code === "Space") {

            event.preventDefault();

            if (
                state === "ready" ||
                state === "result"
            ) {
                startGame();
            }

            return;
        }


        if (state !== "playing") {
            return;
        }


        if (
            event.key >= "1" &&
            event.key <= "8"
        ) {

            var value =
                Number(event.key);

            answer(value);
        }
    }
);


draw();

gameLoop();

</script>

</body>
</html>
